<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6E7C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅行手帳">
<title>旅行手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF4E6;--paper2:#EFE3CB;--ink:#3A2E28;--ink2:#85746A;--red:#E2553F;--matcha:#86AD63;--sky:#7FB2E0;--butter:#F5C94F;--pink:#F4AFA6;--cream:#FFFDF8;--nav:66px;--r:16px 20px 15px 22px/20px 15px 22px 16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:"Huninn","PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--paper);background-image:radial-gradient(#E6D7BA 1.1px,transparent 1.3px);background-size:20px 20px;line-height:1.5}
h1,h2,h3{margin:0;font-weight:normal}
b{font-weight:normal}
.ic{flex:none;vertical-align:middle}
.page{display:none;max-width:560px;margin:0 auto;padding:16px 16px calc(var(--nav) + 28px + env(safe-area-inset-bottom))}
.page.on{display:block}
.pagehead{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 6px}
.pagehead h1{font-size:28px}
h2{font-size:19px;display:inline-block;background:linear-gradient(transparent 62%,rgba(245,201,79,.6) 62%);padding:0 3px;margin-bottom:8px}
.muted{color:var(--ink2)}.small{font-size:13px}
.card{position:relative;background:var(--cream);border:2px solid var(--ink);border-radius:var(--r);box-shadow:3px 4px 0 var(--ink);padding:14px 14px 12px;margin:20px 0}
.tape::before{content:"";position:absolute;top:-12px;left:50%;width:80px;height:22px;transform:translateX(-50%) rotate(-4deg);background:repeating-linear-gradient(-45deg,rgba(244,175,166,.85) 0 7px,rgba(255,253,248,.7) 7px 14px)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{font:inherit;font-size:15px;color:var(--ink);background:var(--butter);border:2px solid var(--ink);border-radius:999px;padding:7px 13px;box-shadow:2px 3px 0 var(--ink);display:inline-flex;align-items:center;gap:5px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
.btn.small{font-size:13.5px;padding:4px 10px}
.btn.red{background:var(--red);color:#fff}.btn.green{background:var(--matcha)}.btn.blue{background:var(--sky)}.btn.white{background:var(--cream)}.btn.danger{color:var(--red)}
.btn:disabled{opacity:.6}
.btn.spin .ic{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.btns{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.btns.end{justify-content:flex-end;align-items:center}.btns.center{justify-content:center}.grow{flex:1}
.c-red{background:var(--red);color:#fff}.c-butter{background:var(--butter)}.c-matcha{background:var(--matcha)}.c-sky{background:var(--sky)}.c-pink{background:var(--pink)}.c-cream{background:var(--cream)}
.net{font-size:12px;border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px;white-space:nowrap}.net.on{background:#E3F0D5}.net.off{background:var(--red);color:#fff}
.mini{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1.5px dashed var(--paper2);cursor:pointer}.mini:last-child{border:0}
.time{font-size:13px;background:var(--paper2);border-radius:8px;padding:1px 7px;min-width:52px;text-align:center}
.mini>span:nth-child(2){flex:1}
.wx{padding:4px 0 10px;border-bottom:1.5px dashed var(--paper2);margin-bottom:6px}
.wx-now{display:flex;align-items:center;gap:12px}
.wx-ic{width:58px;height:58px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:#FFF3C9;flex:none}
.wx-now .big{font-size:34px;margin-right:6px}.wx-now small{display:block;color:var(--ink2)}
.wx-days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center}
.wx-days>div{background:var(--paper);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px}
.wx-days small{font-size:11.5px;color:var(--ink2)}
.sos a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;border-bottom:1.5px dashed var(--paper2);color:inherit;text-decoration:none}.sos a:last-child{border:0}
.sos a b{color:var(--red);font-size:17px;white-space:nowrap}

/* ===== 開場：走進家門 ===== */
.intro{position:fixed;inset:0;z-index:100;overflow:hidden;background:#CFE6F5;--hw:min(78vw,340px);transition:opacity .5s}
.intro.fade{opacity:0;pointer-events:none}
.intro.night{background:#2E3A5C}
.i-sky{position:absolute;inset:0}
.intro.night .i-sky{background-image:radial-gradient(#FFF3C9 1px,transparent 1.6px);background-size:38px 46px}
.i-sun{position:absolute;right:14%;top:12%;width:54px;height:54px;border-radius:50%;background:var(--butter);border:2.5px solid var(--ink)}
.intro.night .i-sun{background:#FFF3C9;box-shadow:inset -12px -4px 0 #E3D3A0}
.i-cloud{position:absolute;width:90px;height:28px;background:#fff;border-radius:20px;animation:drift 18s linear infinite}
.i-cloud::before{content:"";position:absolute;left:18px;top:-16px;width:40px;height:36px;border-radius:50%;background:#fff}
.i-cloud.c1{top:17%;left:8%}.i-cloud.c2{top:29%;left:55%;transform:scale(.7);animation-duration:24s}
.intro.night .i-cloud{opacity:.12}
@keyframes drift{to{translate:40px 0}}
.i-ground{positi
